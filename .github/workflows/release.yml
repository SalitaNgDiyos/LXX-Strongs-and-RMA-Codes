name: Release LXX modules

on:
  push:
    branches: [master]
    paths:
      - 'modules/**/*.zip'
      - 'RELEASE_NOTES.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release for the newest modules file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE=$(ls modules/*/LXX_modules_*.zip | sort -t_ -k3 | tail -n 1)
          TAG=$(basename "$FILE" .zip | sed -E 's/^LXX_modules_[a-z]+_//')
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"; exit 0
          fi
          gh release create "$TAG" "$FILE" \
            --title "LXX-Modules_$TAG" \
            --notes-file RELEASE_NOTES.md \
            --target "$GITHUB_SHA"
