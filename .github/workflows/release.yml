name: Release LXX modules

# One release series per module (Brenton, Swete, Rahlfs). A release is made for a module
# only when a new dated zip for that module has been added; unchanged modules get nothing.
on:
  push:
    branches: [master]
    paths:
      - 'modules/**/*.zip'
      - 'release-notes/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove the earlier combined release (one-time)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete 2026-11-18_0848 --cleanup-tag --yes || true
      - name: Create a release for each module whose file is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for M in Brenton Swete Rahlfs; do
            FILE=$(ls modules/$M/*.zip 2>/dev/null | sort | tail -n 1)
            [ -n "$FILE" ] || continue
            NAME=$(basename "$FILE" .zip)
            TAG="${M}_$(echo "$NAME" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{4}$')"
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "$TAG already exists"; continue
            fi
            gh release create "$TAG" "$FILE" --title "$NAME" \
              --notes-file "release-notes/$M.md" --target "$GITHUB_SHA"
          done
